allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Next 16.4 adapts these plugins for ESLint 10; their published peers still stop at 9.
# Keep every other missing/invalid peer fatal and review exceptions on plugin upgrades.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-import@2.32.0>eslint": "^10.12.0"
    "eslint-plugin-react@7.37.5>eslint": "^10.12.0"
    "eslint-plugin-jsx-a11y@6.10.2>eslint": "^10.12.0"
# Keep the migration confined to the existing Next lint plugin version.
overrides:
  "@next/eslint-plugin-next@16.4.0>fast-glob": "-"
packageExtensions:
  "@next/eslint-plugin-next@16.4.0":
    dependencies:
      tinyglobby: 0.2.17
      fill-range: 7.1.1
patchedDependencies:
  "@next/eslint-plugin-next@16.4.0": patches/@next__eslint-plugin-next@16.4.0.patch
  fdir@6.5.0: patches/fdir@6.5.0.patch
