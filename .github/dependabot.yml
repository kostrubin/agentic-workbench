version: 2
updates:
  # The npm ecosystem also manages package.json and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      compatible-package-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Exact-version Next lint patches need a reviewed port on every upgrade.
      # Only ordinary version updates are manual; security update attempts remain
      # enabled and may still require a maintainer to port the patch.
      - dependency-name: next
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Review future TypeScript and ESLint majors manually after parser/plugin
      # compatibility checks. ESLint 10.x minor/patch updates remain enabled;
      # the scoped peer exceptions exclude ESLint 11 and later majors.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      compatible-action-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
