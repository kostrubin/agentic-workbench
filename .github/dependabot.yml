version: 2
updates:
  # The npm ecosystem also manages package.json and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      compatible-package-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Upgrade these majors together only after parser/plugin compatibility
      # has been verified. Minor/patch updates remain enabled.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      compatible-action-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
